# Spring Boot app + PostgreSQL with a named volume.
#   cp .env.example .env
#   cp secrets/db_password.txt.example secrets/db_password.txt
#   # Edit the two local files, then:
#   docker compose up -d --build
#   curl -X POST "http://localhost:8081/messages?text=hello"
#   curl http://localhost:8081/messages
#   docker compose down        # removes containers and the default network; keeps pgdata
# The project name defaults to this directory's name (05-compose),
# so resources appear as 05-compose-app-1, 05-compose_pgdata, and so on.

services:
  app:
    # Build from the Spring Boot project; the context path is relative to this file.
    build:
      context: ../04-java/springboot
      dockerfile: Dockerfile
    # Tag given to the image that Compose builds.
    image: spring-lab:dev
    # Publish only on the host's loopback address: host 8081 -> container 8080.
    ports:
      - "127.0.0.1:8081:8080"
    # Spring Boot maps these to spring.datasource.*. "db" is resolved by
    # Compose's DNS on the project network.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      # Import files under /run/secrets as Spring configuration properties.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      # Config Tree treats the target filename as the property name.
      - source: db_password
        target: spring.datasource.password
    # Start the app only after the database passes its health check,
    # not merely after the db container has been created.
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      # The official Postgres entrypoint reads the password from this file.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Named volume: data outlives the container and `docker compose down`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Double $ leaves expansion to the shell inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  db_password:
    # This real file is local and ignored; only the .example template is committed.
    file: ./secrets/db_password.txt

volumes:
  pgdata:
